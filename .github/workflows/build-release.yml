# Single obs-light CI/CD workflow.
#
# Normal CI builds (push to main):
#   Checkout, install deps, configure, build, package, upload build artifacts.
#
# Tagged releases (git push --tags v*):
#   Same as above, plus:
#   - Build installer with Inno Setup
#   - Create GitHub Release with installer, portable ZIP and SHA256 checksums
#
# workflow_dispatch:
#   Build with explicit version tag "manual" for testing.

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0-dev)"
        required: false
        type: string

env:
  # OBS Studio version this fork is based on (informational; dependency
  # versions/hashes are pinned in CMakePresets.json)
  OBS_STUDIO_VERSION: 32.2.2
  # CMake build type
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Visual Studio
        run: |
          # windows-2022 runner includes Visual Studio 2022 with MSVC v143
          # Validate that the C++ toolset is present
          if (-not (Test-Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC")) {
            Write-Host "::warning::Visual Studio C++ toolset not found, installing..."
            choco install visualstudio2022buildtools --package-parameters="--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive"
          }
          Write-Host "Visual Studio ready"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not installed" }
          Write-Host "Inno Setup ready: $iscc"

      - name: Compute version
        id: version
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -eq "main") { $version = "0.0.0-ci" }
          elseif ($ref -match "^v\d+\.\d+\.\d+") { $version = $ref.TrimStart("v") }
          else { $version = "0.0.0-$ref" }
          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Qt 6 and obs-deps (FFmpeg, x264, AMF, ...) are downloaded automatically
      # by OBS's own buildspec mechanism (cmake/windows/buildspec.cmake) during
      # CMake configuration: it fetches the exact versions and SHA256 hashes
      # pinned in CMakePresets.json for OBS ${{ env.OBS_STUDIO_VERSION }}.
      # No manual dependency installation is required.
      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_FRONTEND=ON -DENABLE_PLUGINS=ON `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_NVENC=ON -DENABLE_HEVC=ON `
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF `
            -DENABLE_COMPAT_UPDATES=OFF `
            -DOBS_VERSION_OVERRIDE="${{ steps.version.outputs.version }}" `
            -Wno-dev

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Bundle runtime dependencies
        run: |
          # Copy all DLLs from the OBS dependency packages into the run dir.
          # libobs links zlib.dll/jansson.dll, and win-capture pulls in
          # curl.dll via file-updater; OBS's dependency bundling only covers
          # the frontend's direct link libraries, so without this step the
          # executable would show a missing-DLL dialog at startup and hang
          # forever on headless runners.
          $dest = "build\rundir\${{ env.BUILD_TYPE }}\bin\64bit"
          if (-not (Test-Path $dest)) { throw "run dir not found: $dest" }
          $dlls = Get-ChildItem ".deps\obs-deps-*\bin\*.dll" -ErrorAction SilentlyContinue
          if (-not $dlls) { throw "no obs-deps DLLs found under .deps" }
          $dlls | Copy-Item -Destination $dest -Force
          Write-Host "Bundled $($dlls.Count) dependency DLLs into $dest"

      - name: Run smoke test
        timeout-minutes: 10
        run: |
          $exe = "build\rundir\${{ env.BUILD_TYPE }}\bin\64bit\obs-light.exe"
          if (-not (Test-Path $exe)) { throw "obs-light.exe not found" }
          Write-Host "Running smoke test..."
          # GUI-subsystem executables are not waited on by PowerShell when
          # invoked with &, so use Start-Process to get the real exit code.
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          Write-Host "Smoke test passed"

      - name: Print smoke test log
        if: always()
        run: |
          $log = Get-ChildItem "$env:APPDATA\obs-light\logs\obs-light-*.log" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) {
            Write-Host "=== obs-light log: $($log.Name) ==="
            Get-Content $log.FullName
          } else {
            Write-Host "No obs-light log file found"
          }

      - name: Validate artifacts
        shell: pwsh
        run: |
          $expect = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") { $expect = "${{ steps.version.outputs.version }}" }
          .\scripts\validate.ps1 -BuildDir "$pwd\build" -Version $expect -Config "${{ env.BUILD_TYPE }}"

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: obs-light-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: build\rundir\${{ env.BUILD_TYPE }}\
          retention-days: 30

      # ---- Release steps (only on version tags) ----
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ steps.version.outputs.version }}" /DConfigName="${{ env.BUILD_TYPE }}" installer\obs-light.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "build\installer\obs-light-Setup-x64.exe")) {
            throw "Installer build failed"
          }
          Write-Host "Installer built"

      - name: Create portable ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path "build\rundir\${{ env.BUILD_TYPE }}\*" -DestinationPath "build\obs-light-x64.zip" -Force

      - name: Generate SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Get-ChildItem -Path build\installer -Filter "*.exe" | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -FilePath build\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem -Path build -Filter "obs-light-x64.zip" | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -FilePath build\SHA256SUMS.txt -Encoding ascii -Append
          Write-Host "SHA256SUMS:"
          Get-Content build\SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: obs-light ${{ steps.version.outputs.version }}
          body: |
            ## obs-light ${{ github.ref_name }}

            **Lightweight Windows game recording and instant replay.**

            Based on OBS Studio ${{ env.OBS_STUDIO_VERSION }}.

            ### What's new
            - See the [changelog](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.

            ### Installation
            Download the installer (obs-light-Setup-x64.exe) and run it.
            A portable ZIP is also available.

            ### System requirements
            - Windows 10 or 11 (x64)
            - NVIDIA GPU with NVENC (GTX 950 or newer recommended)
            - Hardware-Accelerated GPU Scheduling (HAGS) enabled

            ### Known limitations
            - GPU-accelerated preview requires a Direct3D 11 compatible GPU
            - Smoke tests pass on CI; full GUI/recording tests require physical hardware
          files: |
            build\installer\obs-light-Setup-x64.exe
            build\obs-light-x64.zip
            build\SHA256SUMS.txt
          fail_on_unmatched_files: true